name: Deploy PROD

on:
  push:
    tags:
      - 'v*'


jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Deploy PROD
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "TAG=$TAG bash -s" << 'EOF'
          set -e

          cd /opt/avqon-prod/antivirus-core

          git fetch --tags
          git checkout "$TAG"

          sudo systemctl restart avqon-backend-prod
          echo "PROD deploy done for version $TAG"
          EOF
